name: Auto Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies (MKVToolNix & Inno Setup)
        shell: pwsh
        run: |
          choco install mkvtoolnix innosetup --no-progress

      - name: Prepare Bundled MKVToolNix Binaries
        shell: pwsh
        run: |
          $localTools = "src\MksStudio.UI\tools\mkvtoolnix"
          if (-not (Test-Path $localTools)) {
              New-Item -ItemType Directory -Path $localTools -Force | Out-Null
          }
          $systemMkv = "C:\Program Files\MKVToolNix"
          if (Test-Path "$systemMkv\mkvmerge.exe") {
              Copy-Item "$systemMkv\mkvmerge.exe" "$localTools\" -Force
              Copy-Item "$systemMkv\mkvextract.exe" "$localTools\" -Force
          } else {
              $cmd = Get-Command mkvmerge -ErrorAction SilentlyContinue
              if ($cmd) {
                  $binDir = Split-Path -Parent $cmd.Source
                  Copy-Item "$binDir\mkvmerge.exe" "$localTools\" -Force
                  Copy-Item "$binDir\mkvextract.exe" "$localTools\" -Force
              }
          }
          if (-not (Test-Path "$localTools\mkvmerge.exe")) {
              throw "mkvmerge.exe could not be found or copied to $localTools"
          }
          Write-Host "MKVToolNix binaries successfully verified in $localTools"
          Get-ChildItem $localTools

      - name: Build and Package Release Artifacts
        shell: pwsh
        run: .\build_release.ps1

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) {
              $tag = "${{ github.ref_name }}"
          }
          Write-Host "Target Release Tag: $tag"
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body: ""
          generate_release_notes: false
          files: |
            dist/*.zip
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
